[package]
name = "ai-novel-production-system-core"
version = "0.1.0"
edition = "2021"
default-run = "ai-novel-production-system"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e-test = []

[lib]
name = "ai_novel_production_system_core"
path = "src/lib.rs"

[[bin]]
name = "ai-novel-production-system"
path = "src/main.rs"

[[bin]]
name = "post-b14-ui-r4-bridge"
path = "src/bin/post_b14_ui_r4_bridge.rs"
required-features = ["e2e-test"]

[dependencies]
hex = "0.4"
jsonschema = { version = "0.50.0", default-features = false }
libsql-rusqlite = { version = "0.33", package = "libsql-rusqlite", features = ["bundled", "serde_json", "backup", "blob"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1.25.0", features = ["v4", "v5"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
