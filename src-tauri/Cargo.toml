[package]
name = "ai-novel-production-system-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_novel_production_system_core"
path = "src/lib.rs"

[[bin]]
name = "ai-novel-production-system"
path = "src/main.rs"

[dependencies]
hex = "0.4"
jsonschema = { version = "0.50.0", default-features = false }
libsql-rusqlite = { version = "0.33", package = "libsql-rusqlite", features = ["bundled", "serde_json", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2" }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
